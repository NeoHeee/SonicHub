name: Android

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SonicHub-v0.6.7+17-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonichub-v0.6.7+17-release-apk
          path: build/app/outputs/flutter-apk/SonicHub-v0.6.7+17-release.apk
          if-no-files-found: error
          retention-days: 30
